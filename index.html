<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claudedoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">CLAUDEDOKU</h1>

<div class="topbar">
  <div class="stat">Level <span id="level">1</span></div>
  <div class="stat">Faces <span id="catCount">0</span>/<span id="catTotal">0</span></div>
  <div class="stat">Errors <span id="errorCount">0</span>/3</div>
</div>

<div class="controls">
  <label for="sizeSelect">Grid size:</label>
  <select id="sizeSelect">
    <option value="5">5x5</option>
    <option value="6">6x6</option>
    <option value="7">7x7</option>
    <option value="8" selected>8x8</option>
    <option value="9">9x9</option>
    <option value="10">10x10</option>
  </select>
  <button id="newGameBtn">New Game</button>
  <button id="clearBtn">Clear</button>
</div>

<div id="message" class="message"></div>

<div id="grid" class="grid"></div>

<script src="script.js"></script>
</body>
</html>
